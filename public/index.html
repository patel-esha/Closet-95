<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closet 95</title>
<style>
:root{--gray:#c0c0c0;--light:#fff;--dark:#808080;--black:#000;--pink:#e0559a;--yellow:#fff3a3;--blue:#a6d8ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:16px;font:16px Tahoma,Verdana,sans-serif;color:var(--black);
background:repeating-linear-gradient(0deg,rgba(255,150,190,.35) 0 10px,transparent 10px 28px),repeating-linear-gradient(90deg,rgba(255,150,190,.35) 0 10px,transparent 10px 28px),var(--yellow)}
.win{max-width:420px;margin:0 auto;background:var(--gray);padding:3px;border:2px solid;border-color:var(--light) var(--black) var(--black) var(--light);box-shadow:inset -1px -1px var(--dark),inset 1px 1px #dfdfdf}
.bar{background:var(--pink);color:#fff;font:bold 15px "Courier New",monospace;padding:6px 8px}
.body{padding:14px}
label{display:block;margin:12px 0 4px}
input[type=text],select{width:100%;font:inherit;padding:8px;background:#fff;border:2px solid;border-color:var(--dark) var(--light) var(--light) var(--dark)}
.btn{font:inherit;padding:10px 16px;background:var(--gray);border:2px solid;border-color:var(--light) var(--black) var(--black) var(--light);cursor:pointer}
.btn:active{border-color:var(--black) var(--light) var(--light) var(--black)}
.btn:disabled{color:var(--dark);cursor:default}
.btn.go{width:100%;margin-top:16px;font-weight:bold}
.pick{display:block;text-align:center}
#file{position:absolute;opacity:0;width:1px;height:1px}
#file:focus-visible+.btn,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px dotted var(--black);outline-offset:2px}
.preview{margin-top:12px;min-height:120px;background:var(--blue);border:2px solid;border-color:var(--dark) var(--light) var(--light) var(--dark);display:flex;align-items:center;justify-content:center;text-align:center;padding:6px}
.preview img{max-width:100%;max-height:300px;display:block}
.status{margin-top:14px;padding:8px;min-height:38px;background:#fff;border:2px solid;border-color:var(--dark) var(--light) var(--light) var(--dark);font-size:14px}
.status.err{color:#a00000}
.status.ok{color:#006400}
</style>
</head>
<body>
<div class="win">
<div class="bar">Add item.exe</div>
<div class="body">
<div class="pick">
<input type="file" id="file" accept="image/*">
<label for="file" class="btn" id="pickbtn" tabindex="0" style="margin:0;display:block">Take or choose a photo</label>
</div>
<div class="preview" id="preview">No photo yet</div>
<label for="name">Name</label>
<input type="text" id="name" placeholder="Blue tee" autocomplete="off">
<label for="category">Category</label>
<select id="category">
<option>top</option><option>bottom</option><option>shoes</option><option>outerwear</option><option>accessory</option>
</select>
<label for="occasion">Occasion</label>
<select id="occasion">
<option value="casual">everyday casual</option><option value="going out">going out</option><option value="work">work</option><option value="gym">gym</option>
</select>
<button class="btn go" id="send">Add to closet</button>
<div class="status" id="status" role="status">Ready.</div>
</div>
</div>
<script>
const file=document.getElementById('file'),preview=document.getElementById('preview'),
nameEl=document.getElementById('name'),statusEl=document.getElementById('status'),send=document.getElementById('send');
function say(msg,cls){statusEl.textContent=msg;statusEl.className='status '+(cls||'')}
document.getElementById('pickbtn').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();file.click()}});
file.addEventListener('change',()=>{
const f=file.files[0];
if(!f){preview.textContent='No photo yet';return}
const img=document.createElement('img');
img.src=URL.createObjectURL(f);
img.alt='Selected photo';
preview.replaceChildren(img);
say('Photo ready.')
});
send.addEventListener('click',async()=>{
const f=file.files[0],name=nameEl.value.trim();
if(!f){say('Choose a photo first.','err');return}
if(!name){say('Enter a name first.','err');nameEl.focus();return}
const fd=new FormData();
fd.append('photo',f);
fd.append('name',name);
fd.append('category',document.getElementById('category').value);
fd.append('occasion',document.getElementById('occasion').value);
send.disabled=true;say('Sending...');
try{
const r=await fetch('/items',{method:'POST',body:fd});
const t=await r.text();
if(r.ok){say('Saved as '+t,'ok');nameEl.value='';file.value='';preview.textContent='No photo yet'}
else{say('Server said '+r.status+': '+t,'err')}
}catch(e){say('Could not reach the server. Check Wi-Fi and the address.','err')}
send.disabled=false
});
</script>
</body>
</html>
